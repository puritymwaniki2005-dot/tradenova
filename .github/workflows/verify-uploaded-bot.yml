name: Verify uploaded TradeNovaX bot

on:
  push:
    paths:
      - "bot-app (2).zip"
      - "scripts/build-uploaded-bot.mjs"
      - "vercel.json"
      - ".github/workflows/verify-uploaded-bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-bot-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the exact uploaded bot using the shared deployment script
        env:
          NEXT_PUBLIC_DERIV_APP_ID: 34g3dK2hXuNSYEMsOUlvT
          NEXT_PUBLIC_DERIV_APP_NAME: TradeNovaX
          NEXT_PUBLIC_DERIV_ENV: production
          NEXT_PUBLIC_DERIV_OAUTH_SCOPES: trade
        run: node scripts/build-uploaded-bot.mjs

      - name: Save verified build output
        uses: actions/upload-artifact@v4
        with:
          name: tradenovax-uploaded-bot-build
          path: bot-app-source/dist/
          if-no-files-found: error
          retention-days: 7
