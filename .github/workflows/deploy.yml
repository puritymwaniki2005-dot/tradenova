name: Build and deploy TradeNovaX
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the uploaded ZIP application
        env:
          NEXT_PUBLIC_DERIV_APP_ID: 34g3dK2hXuNSYEMsOUlvT
          NEXT_PUBLIC_DERIV_APP_NAME: TradeNovaX
          NEXT_PUBLIC_DERIV_ENV: production
          NEXT_PUBLIC_DERIV_OAUTH_SCOPES: trade
        run: node scripts/build-uploaded-bot.mjs
      - name: Upload the ZIP application's build to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: bot-app-source/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
